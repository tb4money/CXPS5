name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach cxps5.elf to a release on tags

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zlib1g-dev python3 zip curl unzip file

      # Host build + API tests against a fake game folder (no console needed).
      - name: Host tests
        run: make test

      # Prebuilt library bundle (curl, openssl, zlib, ...) from pacbrew-repo, unpacked to /opt/ps5-payload-sdk,
      # then the SDK release on top of it so the SDK wins.
      - name: Install ps5-payload-sdk and libraries
        run: |
          set -x
          sudo mkdir -p /opt
          if curl -fL --retry 3 -o libs.tar.gz \
              https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz; then
            sudo tar xf libs.tar.gz -C /
          else
            echo "::warning::could not download the pacbrew library bundle"
          fi
          if curl -fL --retry 3 -o sdk.zip \
              https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip; then
            sudo unzip -q -o -d /opt sdk.zip
          elif [ ! -x "$PS5_PAYLOAD_SDK/bin/prospero-clang" ]; then
            git clone --depth 1 https://github.com/ps5-payload-dev/sdk
            sudo make -C sdk DESTDIR="$PS5_PAYLOAD_SDK" clean install
          fi
          test -x "$PS5_PAYLOAD_SDK/bin/prospero-clang" || { ls -R /opt | head -50; exit 1; }
          echo "$PS5_PAYLOAD_SDK/bin" >> "$GITHUB_PATH"
          ls "$PS5_PAYLOAD_SDK/target/user/homebrew/include" | head -50 || true
          ls "$PS5_PAYLOAD_SDK/target/user/homebrew/lib" | grep -E "curl|ssl|crypto|zstd|psl|libz" || true

      - name: Build cxps5.elf
        run: |
          set -x
          echo "commit: $(git log -1 --oneline)"
          mkdir -p build
          python3 tools/embed.py ui/index.html build/ui_html.h UI_HTML
          INC="$PS5_PAYLOAD_SDK/target/user/homebrew/include"
          CC="$PS5_PAYLOAD_SDK/bin/prospero-clang"
          COMMON="-O2 -std=gnu11 -Wall -Wextra -Wno-unused-parameter -Wno-format-truncation -Ibuild -isystem $INC"
          rm -f cxps5.elf
          if [ -f "$INC/curl/curl.h" ] && "$CC" $COMMON -DHAVE_CURL -DCACERT_PATH="\"$PWD/third_party/cacert.pem\"" \
               -o cxps5.elf src/cxps5.c -lcurl -lssl -lcrypto -lz -lzstd -lpsl; then
            echo "built WITH curl (link downloads enabled)"
          else
            echo "::warning::curl build failed or curl port missing, building without link downloads"
            rm -f cxps5.elf
            "$CC" $COMMON -o cxps5.elf src/cxps5.c -lz
          fi
          ls -l cxps5.elf
          file cxps5.elf

      - name: Package
        run: |
          mkdir -p dist
          cp cxps5.elf config.ini.example README.md dist/
          sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cxps5
          path: |
            dist/cxps5.elf
            dist/config.ini.example
            dist/cxps5-*-src.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cxps5.elf
            dist/config.ini.example
            dist/cxps5-*-src.zip
